services:
  api:
    image: ghcr.io/kl1ro/mip-bi-back:${API_TAG:-latest}

    build:
      context: .
      secrets:
        - node_auth_token

    environment:
      PORT: 3000
      DATABASE_URL: postgres://mip_bi:${POSTGRES_PASSWORD}@postgres:5432/mip_bi
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_started

  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: mip_bi
      POSTGRES_USER: mip_bi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mip_bi -d mip_bi"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8

    volumes:
      - redis-data:/data

secrets:
  node_auth_token:
    environment: NODE_AUTH_TOKEN

volumes:
  postgres-data:
  redis-data:
